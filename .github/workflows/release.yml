name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true
      platforms:
        description: linux, windows and macos, space-separated (publish_release.py builds the first two locally)
        default: linux windows macos

permissions:
  contents: write

jobs:
  release:
    uses: SomeoneIsWorking/psxport/.github/workflows/title-release.yml@main
    with:
      product: spyro_port
      tag: ${{ inputs.tag }}
      platforms: ${{ inputs.platforms }}
