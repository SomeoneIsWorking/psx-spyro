name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    uses: SomeoneIsWorking/psxport/.github/workflows/title-release.yml@main
    with:
      product: spyro_port
      tag: ${{ inputs.tag || github.ref_name }}
