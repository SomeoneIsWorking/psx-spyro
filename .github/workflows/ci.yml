name: CI

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: spyro-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Linux x86_64)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out Spyro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install locked Python runner
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.12
          enable-cache: false

      - name: Resolve psxport
        run: uv run --no-project https://raw.githubusercontent.com/SomeoneIsWorking/psxport/main/tools/psxport_fetch.py --auto

      - name: Provision the canonical Linux dependencies
        uses: ./external/psxport/.github/actions/setup-linux
        with:
          framework-directory: external/psxport

      - name: Build
        run: uv run --frozen python external/psxport/tools/port/consumer_build.py --build build/ci --target spyro_port
